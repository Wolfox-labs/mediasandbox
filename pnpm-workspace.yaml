packages:
  - 'packages/*'
  # `packages/web-vue` 是 vendored 的 soybean-admin：它自己是"包 + 子包"结构
  # （packages/{axios,hooks,materials,scripts,uno-preset,utils,color} 以
  # `workspace:*` 被主包引用）。这一行让根 workspace 把它们也当成工作区包，
  # 否则 `@sa/*` 解析不到，装依赖会直接失败。
  - 'packages/web-vue/packages/*'

# 原生构建脚本白名单。
#
# 三个可选依赖我们这条链路用不到，明确设为 false：
#   cpu-features  只在 ssh2 传输时用于加速，我们走本地 unix socket / named pipe
#   ssh2          仅 Docker over SSH 时需要，本项目不涉及
#   protobufjs    其 postinstall 只生成可选的类型定义，运行不需要
# 留空会让 pnpm 每次 install 都报错中断，所以必须显式写 false。
#
# esbuild 相反，**必须允许**：它的 postinstall 负责放置平台原生二进制，
# 不跑就没有可执行的 esbuild，Vite 起不来。
# @parcel/watcher 也设为 false：它是 **sass 的可选依赖**，而 sass 的 install
# 脚本是 `node scripts/build-from-source.js`（真的去编译）。我们只用 sass 的库
# API，不用它的 watch 模式，且平台预编译绑定（@parcel/watcher-win32-x64）
# 本来就随包装好了 —— 没有任何理由在本机跑一次 node-gyp。
allowBuilds:
  '@parcel/watcher': false
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  # 以下四项来自 vendored 的 soybean-admin（packages/web-vue），
  # 与其模板自带的 allowBuilds 保持一致：
  #   core-js / es5-ext  只跑"提示升级"之类的 postinstall，不需要
  #   typeit             UI 动效库的可选脚本，构建不需要
  #   vue-demi           会按 Vue 版本改写入自己的 dist，**不需要**跑脚本
  core-js: false
  es5-ext: false
  typeit: false
  vue-demi: false

# 依赖版本强制。
#
# 两个 chokidar 对 `readdirp` 的要求不同，而**各自声明的范围本来就是对的**：
#   chokidar@3.6.0  readdirp: ~3.6.0  用 CJS `require('readdirp')`，不需要具名导出
#   chokidar@5.0.0  readdirp: ^5.0.0  用 ESM `import { readdirp, ReaddirpStream } from 'readdirp'`
#
# 曾经把 readdirp **全局**钉到 3.6.0，于是 chokidar@5 拿到 CJS 的 3.6.0，
# 在加载 vite.config 时炸掉：
#
#   The requested module 'readdirp' does not provide an export named 'ReaddirpStream'
#
# 这条报错来自 chokidar@5，不是 chokidar@3 —— readdirp@3.6.0 是 CJS，本来就没有这个
# 具名导出。所以只对 chokidar@3 钉版，chokidar@5 用回它自己声明的 ^5.0.0。
overrides:
  'chokidar@3>readdirp': 3.6.0
